x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    build: ./server
    env_file: .env
    volumes: ["./data:/app/data"]
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  web:
    build: ./web
    # only what the web app needs (no Telegram credentials, no stream secret)
    environment:
      API_URL: http://server:8080
      API_SECRET: ${API_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      SITE_PASSWORD: ${SITE_PASSWORD}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, server]
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
